<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #2864e8;
            margin-bottom: 35px;
        }

        label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2864e8;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #174fc4;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #2864e8;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>✏️ Edit Task</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Task Title:</label>
        <input type="text" name="title" value="{{ task.title }}" required>

        <label>Description:</label>
        <textarea name="description">{{ task.description }}</textarea>

        <button type="submit">Update Task</button>
    </form>

    <a class="back" href="/">← Back to Task List</a>

</div>

</body>
</html>
